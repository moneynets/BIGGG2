<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙人大老二</title><style>
*{box-sizing:border-box}body{margin:0;background:#102b24;color:#fff;font-family:system-ui,'Microsoft JhengHei',sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}h1{margin:5px 0 10px}.muted{color:#c1d8cc}.panel{border:1px solid #407460;border-radius:18px;background:#1a4a38;padding:18px;margin:14px 0}.opponent{text-align:center}.table{min-height:190px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.card{border:2px solid #eee;border-radius:9px;background:white;color:#15251f;width:55px;height:82px;font-size:20px;font-weight:750;cursor:pointer;box-shadow:0 2px 4px #0003}.card.red{color:#c12a3a}.card.selected{transform:translateY(-12px);border:3px solid #ffcf56;background:#fff7db}.card:disabled{cursor:default}.actions{display:flex;gap:10px;justify-content:center;margin:20px}button.action{border:0;border-radius:10px;padding:13px 25px;font-size:17px;font-weight:700;cursor:pointer;background:#f7cf70;color:#182b20}button.secondary{background:#c3d6cc}button:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;font-size:18px;font-weight:700}#toast{color:#ffd19a;text-align:center;min-height:24px}.hidden{display:none}footer{font-size:12px;text-align:center;color:#b5cfc0}@media(max-width:600px){.wrap{padding:10px}.panel{padding:12px}.card{width:42px;height:66px;font-size:16px}.cards{gap:4px}}
</style></head><body><main class="wrap"><h1>🃏 雙人大老二</h1><p class="muted">52 張全發完 · 每人 26 張 · 自動配對 · 不用房號</p><div class="panel opponent"><h3>對手 <span id="opcount">—</span></h3><div id="opcards" class="muted">等待連線</div></div><div class="panel table"><div id="status" class="status">連線中…</div><p id="info" class="muted"></p><div id="tablecards" class="cards"></div></div><div class="panel"><h3>你的手牌 <span id="count"></span></h3><div id="hand" class="cards"></div><div class="actions"><button id="play" class="action" disabled>出牌</button><button id="pass" class="action secondary" disabled>Pass</button></div><div id="toast" role="alert"></div></div><footer>雙人版規則：梅花3先出；牌型為單張、對子、三條、順子、同花、葫蘆、鐵支、同花順。對方 Pass 後重新領出。</footer></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let state={status:'waiting'},selected=new Set();const $=id=>document.getElementById(id);const sym={C:'♣',D:'♦',H:'♥',S:'♠'};const face={1:'A',11:'J',12:'Q',13:'K'};const label=c=>sym[c.s]+(face[c.v]||c.v);const red=c=>c.s==='D'||c.s==='H';function makeCard(c,clickable){const b=document.createElement('button');b.className='card'+(red(c)?' red':'')+(selected.has(c.id)&&clickable?' selected':'');b.textContent=label(c);b.type='button';if(clickable)b.onclick=()=>{selected.has(c.id)?selected.delete(c.id):selected.add(c.id);render();};else b.disabled=true;return b;}
function render(){const playing=state.status==='playing';$('opcount').textContent=state.opponentCount===undefined?'':`（剩 ${state.opponentCount} 張）`;$('opcards').textContent=playing||state.status==='finished'?'🂠 '.repeat(Math.min(state.opponentCount||0,15)):'尚未配對';$('count').textContent=state.hand?`（${state.hand.length} 張）`:'';$('hand').replaceChildren(...(state.hand||[]).map(c=>makeCard(c,true)));$('tablecards').replaceChildren(...(state.table?.cards||[]).map(c=>makeCard(c,false)));$('status').textContent=state.status==='waiting'?'等待第二位玩家加入…':state.status==='finished'?(state.winner==='you'?'🎉 你贏了！':'本局結束，對方獲勝'):state.turn?'輪到你出牌':'等待對方出牌';$('info').textContent=state.message||'';$('play').disabled=!playing||!state.turn||!selected.size;$('pass').disabled=!playing||!state.turn||!state.table;}
socket.on('state',s=>{state=s;selected.clear();$('toast').textContent='';render();});socket.on('errorMsg',msg=>{$('toast').textContent=msg;});socket.on('disconnect',()=>{$('status').textContent='連線中斷，正在重連…';$('play').disabled=true;$('pass').disabled=true;});$('play').onclick=()=>socket.emit('play',[...selected]);$('pass').onclick=()=>socket.emit('pass');render();
</script></body></html>
